<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Classic Engraving Hatch Pattern -->
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#333" stroke-width="1.5" opacity="0.4"/>
    </pattern>
    <!-- Paper Texture Gradient -->
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffef0"/>
      <stop offset="50%" stop-color="#fdfbf0"/>
      <stop offset="100%" stop-color="#f0e6d2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>

  <!-- Background for preview -->
  <rect width="100%" height="100%" fill="#e8e8e8" />

  <g transform="translate(400, 250)">
    
    <!-- === BACKGROUND ORNAMENTS / FOLIAGE === -->
    <g stroke="#333" stroke-width="2" fill="none" stroke-linecap="round">
      <!-- Top Left Swirls -->
      <path d="M -280 -90 C -320 -130, -380 -100, -350 -50 C -330 -20, -380 20, -420 0" />
      <path d="M -350 -50 C -400 -60, -420 -120, -360 -140" stroke-width="1"/>
      
      <!-- Top Right Swirls (Mirrored) -->
      <path d="M 280 -90 C 320 -130, 380 -100, 350 -50 C 330 -20, 380 20, 420 0" />
      <path d="M 350 -50 C 400 -60, 420 -120, 360 -140" stroke-width="1"/>
      
      <!-- Bottom Flourishes -->
      <path d="M -200 120 Q -240 180, -300 150" />
      <path d="M 200 120 Q 240 180, 300 150" />
    </g>

    <!-- === SCROLL BANNER === -->
    
    <!-- Shadow/Back rolls -->
    <path d="M -260 -80 L -300 -40 Q -310 -20, -290 -20 L -250 -60 Z" fill="url(#hatch)" stroke="black" stroke-width="2"/>
    <path d="M 260 80 L 300 120 Q 310 140, 290 140 L 250 100 Z" fill="url(#hatch)" stroke="black" stroke-width="2"/>

    <!-- Main Scroll Body -->
    <!-- The S-Curve top and bottom -->
    <g filter="url(#shadow)">
        <path d="
          M -260 -80 
          C -100 -40, 100 -40, 260 -80   
          L 260 80
          C 100 120, -100 120, -260 80
          Z
        " fill="url(#paper)" stroke="black" stroke-width="3" />
    </g>

    <!-- Inner Borders (Engraving style) -->
    <path d="
      M -250 -70 
      C -100 -35, 100 -35, 250 -70   
      L 250 70
      C 100 105, -100 105, -250 70
      Z
    " fill="none" stroke="black" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>

    <!-- Scroll Roll Ends (The 3D Cylinder look) -->
    <!-- Top Left Curl -->
    <g transform="translate(-260, -80)">
         <path d="M 0 0 C -30 20, -30 60, 0 80" fill="#fffef0" stroke="black" stroke-width="2"/>
         <path d="M 0 80 C -10 70, -10 10, 0 0" fill="url(#hatch)" opacity="0.5"/> 
         <ellipse cx="0" cy="0" rx="10" ry="20" fill="white" stroke="black" stroke-width="2" transform="rotate(-15)"/>
    </g>

    <!-- Top Right Curl (End cap) -->
    <g transform="translate(260, -80)">
        <path d="M 0 0 L 0 160" stroke="none"/> <!-- Invisible spacer -->
        <ellipse cx="0" cy="0" rx="8" ry="20" fill="white" stroke="black" stroke-width="2" transform="rotate(15)"/>
    </g>

    <!-- Bottom Left Curl (End cap) -->
    <g transform="translate(-260, 80)">
       <ellipse cx="0" cy="0" rx="8" ry="20" fill="white" stroke="black" stroke-width="2" transform="rotate(-15)"/>
    </g>

    <!-- Bottom Right Curl -->
    <g transform="translate(260, 80)">
         <path d="M 0 0 C 30 -20, 30 -60, 0 -80" fill="#fffef0" stroke="black" stroke-width="2"/>
         <ellipse cx="0" cy="0" rx="10" ry="20" fill="white" stroke="black" stroke-width="2" transform="rotate(15)"/>
    </g>


    <!-- === TEXT === -->
    <g font-family="'Times New Roman', serif" text-anchor="middle" fill="#222">
        <text x="0" y="-10" font-size="70" font-weight="bold" letter-spacing="2" style="text-shadow: 2px 2px 0px #ddd;">SCROLL</text>
        
        <!-- Decorative dividers around 'Banner' -->
        <g stroke="black" stroke-width="2">
             <line x1="-120" y1="15" x2="-80" y2="15" />
             <line x1="80" y1="15" x2="120" y2="15" />
             <circle cx="-130" cy="15" r="3" fill="black"/>
             <circle cx="130" cy="15" r="3" fill="black"/>
        </g>
        
        <text x="0" y="60" font-size="50" font-weight="bold" letter-spacing="8">BANNER</text>
        
        <!-- Bottom ornamental diamond -->
        <path d="M 0 85 L 10 95 L 0 105 L -10 95 Z" fill="black"/>
    </g>
    
  </g>
</svg>
