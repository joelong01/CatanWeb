<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catan Companion</title>
    <link rel="stylesheet" href="companion.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎲 Catan Companion</h1>
            <div class="connection-status" id="connectionStatus">
                <span class="status-dot"></span>
                <span class="status-text">Connecting...</span>
            </div>
        </header>

        <main>
            <!-- Player Selection Section -->
            <section class="player-section" id="playerSection">
                <h2>Select Your Player</h2>
                <select id="playerSelect" class="player-select">
                    <option value="">Choose your player...</option>
                </select>
            </section>

            <!-- Game State Display -->
            <section class="game-state" id="gameState">
                <div class="game-info">
                    <div class="info-item">
                        <label>Current Player:</label>
                        <span id="currentPlayer" class="current-player">-</span>
                    </div>
                    <div class="info-item">
                        <label>Game State:</label>
                        <span id="gameStateDisplay" class="game-state-text">-</span>
                    </div>
                    <div class="info-item">
                        <label>Version:</label>
                        <span id="gameVersion" class="version">-</span>
                    </div>
                </div>
            </section>

            <!-- Action Buttons -->
            <section class="actions" id="actionsSection">
                <h2>Available Actions</h2>
                
                <!-- Basic Actions -->
                <div class="action-group">
                    <h3>Game Flow</h3>
                    <button id="nextBtn" class="action-btn primary" onclick="doAction('Next')">
                        <span class="btn-icon">▶️</span>
                        <span class="btn-text">Next</span>
                    </button>
                    <button id="undoBtn" class="action-btn secondary" onclick="doAction('Undo')">
                        <span class="btn-icon">↩️</span>
                        <span class="btn-text">Undo</span>
                    </button>
                    <button id="redoBtn" class="action-btn secondary" onclick="doAction('Redo')">
                        <span class="btn-icon">↪️</span>
                        <span class="btn-text">Redo</span>
                    </button>
                </div>

                <!-- Purchase Actions -->
                <div class="action-group">
                    <h3>Purchases</h3>
                    <div id="purchaseButtons" class="purchase-grid">
                        <!-- Purchase buttons will be populated dynamically -->
                    </div>
                </div>

                <!-- Roll Actions -->
                <div class="action-group" id="rollSection" style="display: none;">
                    <h3>Dice Roll</h3>
                    <button id="rollBtn" class="action-btn roll" onclick="rollDice()">
                        <span class="btn-icon">🎲</span>
                        <span class="btn-text">Roll Dice</span>
                    </button>
                </div>
            </section>

            <!-- Messages/Notifications -->
            <section class="messages" id="messagesSection">
                <div id="messageContainer" class="message-container">
                    <!-- Messages will appear here -->
                </div>
            </section>
        </main>

        <footer>
            <div class="footer-info">
                <span>Game ID: <span id="gameId">-</span></span>
                <span>Last Update: <span id="lastUpdate">-</span></span>
            </div>
        </footer>
    </div>

    <!-- Error Modal -->
    <div id="errorModal" class="modal">
        <div class="modal-content">
            <h3>Error</h3>
            <p id="errorMessage"></p>
            <button onclick="closeErrorModal()" class="modal-btn">OK</button>
        </div>
    </div>

    <script src="companion.js"></script>
</body>
</html>
