<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catan Companion</title>
    <link rel="stylesheet" href="companion.css">
</head>

<body>
    <div class="container">
        <!-- Enhanced Header -->
        <header>
            <div class="header-title">
                <h1>🎲 Catan Companion</h1>
                <div class="connection-status" id="connectionStatus">
                    <span class="status-dot"></span>
                    <span class="status-text">Connecting...</span>
                </div>
            </div>
        </header>

        <main>
            <!-- Enhanced Player Selection Section -->
            <section class="player-section" id="playerSection">
                <h2>Select Your Player</h2>
                <select id="playerSelect" class="player-select">
                    <option value="">Choose your player...</option>
                </select>
            </section>

            <!-- Enhanced Game Header -->
            <section class="game-header" id="gameHeader">
                <div class="player-list">
                    <label>Players:</label>
                    <div id="playerList" class="player-names">
                        <!-- Player names will be populated here -->
                    </div>
                </div>
                <div class="game-info">
                    <div class="info-item">
                        <label>Current Turn:</label>
                        <span id="currentPlayer" class="current-player">-</span>
                    </div>
                    <div class="info-item">
                        <label>Waiting For:</label>
                        <span id="waitingFor" class="waiting-for">-</span>
                    </div>
                </div>
            </section>

            <!-- Always Available Actions -->
            <section class="actions" id="actionsSection">
                <h2>Game Controls</h2>
                <div class="action-group">
                    <button id="undoBtn" class="action-btn secondary" onclick="doAction('Undo')">
                        <span class="btn-icon">⬅️</span>
                        <span class="btn-text">Undo</span>
                    </button>
                    <button id="nextBtn" class="action-btn primary" onclick="doAction('Next')">
                        <span class="btn-icon">▶️</span>
                        <span class="btn-text">Next</span>
                    </button>
                    <button id="redoBtn" class="action-btn secondary" onclick="doAction('Redo')">
                        <span class="btn-icon">➡️</span>
                        <span class="btn-text">Redo</span>
                    </button>
                </div>
            </section>

            <!-- State-Specific Content Area -->
            <section class="state-content" id="stateContent">
                <!-- Dynamic content based on game state will be inserted here -->
            </section>

            <!-- Game State Display -->
            <section class="game-state" id="gameState">
                <div class="game-info">
                    <div class="info-item">
                        <label>Game State:</label>
                        <span id="gameStateDisplay" class="game-state-text">-</span>
                    </div>
                    <div class="info-item">
                        <label>Version:</label>
                        <span id="gameVersion" class="version">-</span>
                    </div>
                </div>
            </section>

            <!-- Messages/Notifications -->
            <section class="messages" id="messagesSection">
                <div id="messageContainer" class="message-container">
                    <!-- Messages will appear here -->
                </div>
            </section>
        </main>

        <footer>
            <div class="footer-info">
                <span>Game ID: <span id="gameId">-</span></span>
                <span>Last Update: <span id="lastUpdate">-</span></span>
            </div>
        </footer>
    </div>

    <!-- Error Modal -->
    <div id="errorModal" class="modal">
        <div class="modal-content">
            <h3>Error</h3>
            <p id="errorMessage"></p>
            <button onclick="closeErrorModal()" class="modal-btn">OK</button>
        </div>
    </div>

    <script src="companion.js"></script>
</body>

</html>
