<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" id="viewport-meta" />
    <script>
        // Mobile: use fixed 1920 width with zoom capability
        // Desktop: use device-width (standard responsive)
        (function() {
            var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
                           (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
            if (isMobile) {
                document.getElementById('viewport-meta').setAttribute('content',
                    'width=1920, initial-scale=0.39, minimum-scale=0.1, maximum-scale=2.0, viewport-fit=cover');
            }
        })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Catan3.WebUI</title>
    <base href="/" />
    <!-- CSS/JS Cache Busting: Update version query params when CSS/JS changes
         To update all versions at once, run from repo root:
         sed -i '' 's/2026-01-13-v1/YYYY-MM-DD-vN/g' WebUI/wwwroot/index.html
         Also update CSS content strings in *.razor.css files (see MainLayout.razor.css) -->
    <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css?v=2026-01-13-v1" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Catan3.WebUI.styles.css?v=2026-01-13-v1" rel="stylesheet" />

    <!-- Prefetch critical theme assets while WASM loads -->
    <link rel="prefetch" href="themes/base/tiles/brick.png" as="image" />
    <link rel="prefetch" href="themes/base/tiles/wheat.png" as="image" />
    <link rel="prefetch" href="themes/base/tiles/sheep.png" as="image" />
    <link rel="prefetch" href="themes/base/tiles/wood.png" as="image" />
    <link rel="prefetch" href="themes/base/tiles/ore.png" as="image" />
    <link rel="prefetch" href="themes/base/tiles/desert.png" as="image" />
</head>

<body>
    <div id="app">
        <div class="loading-screen">
            <div class="loading-logo">
                <svg viewBox="0 0 100 87" class="loading-hexagon">
                    <polygon points="50,0 100,25 100,75 50,100 0,75 0,25" fill="none" stroke="#d4a853" stroke-width="3"/>
                    <polygon points="50,10 90,30 90,70 50,90 10,70 10,30" fill="#2d5a27" stroke="#1a3d18" stroke-width="2"/>
                </svg>
            </div>
            <h1 class="loading-title">Catan</h1>
            <div class="loading-spinner-container">
                <svg class="loading-progress">
                    <circle r="40%" cx="50%" cy="50%" />
                    <circle r="40%" cx="50%" cy="50%" />
                </svg>
            </div>
            <div class="loading-progress-text"></div>
            <div class="loading-hint">Preparing your game...</div>
            <div class="loading-log" id="loading-log"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script src="js/svgRasterizer.js?v=2026-01-13-v1"></script>
    <script src="js/viewportScaler.js?v=2026-01-13-v1"></script>

    <!-- Loading diagnostics and Blazor boot -->
    <script>
        (function() {
            var startTime = Date.now();
            var logElement = document.getElementById('loading-log');

            // Log a timestamped message to the loading screen
            function logMessage(text, isError) {
                var elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                var entry = document.createElement('div');
                entry.className = 'log-entry' + (isError ? ' log-error' : '');
                entry.textContent = '[' + elapsed + 's] ' + text;
                if (logElement) {
                    logElement.appendChild(entry);
                    logElement.scrollTop = logElement.scrollHeight;
                }
                console.log('[Loading ' + elapsed + 's] ' + text);
            }

            // Update loading hint
            function setHint(text) {
                var hint = document.querySelector('.loading-hint');
                if (hint) hint.textContent = text;
            }

            // Determine API URL based on hostname (mirrors GameServiceConfig.cs logic)
            var host = window.location.hostname;
            var apiUrl;
            if (host.endsWith('.azurewebsites.net')) {
                var baseName = host.split('.')[0];
                apiUrl = 'https://' + baseName + '-api.azurewebsites.net';
            } else {
                apiUrl = 'http://' + host + ':8080';
            }

            // Log initial state
            logMessage('Page loaded, UA: ' + navigator.userAgent.substring(0, 50) + '...');
            logMessage('API URL: ' + apiUrl);

            // Prefetch an image
            function prefetchImage(url) {
                var img = new Image();
                img.src = url;
            }

            // Fetch players and prefetch images
            setHint('Warming up server...');
            logMessage('Fetching players from API...');
            fetch(apiUrl + '/api/players')
                .then(function(response) {
                    logMessage('API response: ' + response.status);
                    return response.json();
                })
                .then(function(data) {
                    if (data.success && data.players) {
                        logMessage('Got ' + data.players.length + ' players, prefetching images...');
                        setHint('Loading player images...');
                        data.players.forEach(function(player) {
                            if (player.imageUri) {
                                prefetchImage(apiUrl + player.imageUri);
                            }
                        });
                        setHint('Almost ready...');
                    }
                })
                .catch(function(err) {
                    logMessage('API fetch failed: ' + (err.message || err), true);
                    setHint('Starting without prefetch...');
                });

            // Check for loading test mode (add ?loading-test to URL to keep loading screen visible)
            var isLoadingTest = window.location.search.indexOf('loading-test') !== -1;
            if (isLoadingTest) {
                logMessage('*** LOADING TEST MODE - Blazor will not start ***', true);
                logMessage('Remove ?loading-test from URL to load normally');
                setHint('Loading test mode - Blazor disabled');
                return; // Don't start Blazor
            }

            // Start Blazor with progress reporting
            setHint('Loading Blazor runtime...');
            logMessage('Starting Blazor WASM...');

            Blazor.start({
                loadBootResource: function(type, name, defaultUri, integrity) {
                    // Log resource loading for diagnostics
                    if (type === 'dotnetjs') {
                        logMessage('Loading .NET runtime...');
                    } else if (type === 'dotnetwasm') {
                        logMessage('Loading .NET WASM (' + (defaultUri.length > 50 ? '...' : defaultUri) + ')...');
                    } else if (type === 'assembly' && name.startsWith('Catan')) {
                        logMessage('Loading ' + name + '...');
                    }
                    // Return null to use default loading behavior
                    return null;
                }
            }).then(function() {
                logMessage('Blazor started successfully!');
            }).catch(function(err) {
                logMessage('Blazor failed to start: ' + (err.message || err), true);
                setHint('Failed to load - check log below');
            });
        })();
    </script>
</body>

</html>
