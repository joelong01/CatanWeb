<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" id="viewport-meta" />
    <script>
        // Mobile: use fixed 1920 width with zoom capability
        // Desktop: use device-width (standard responsive)
        (function() {
            var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
                           (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
            if (isMobile) {
                document.getElementById('viewport-meta').setAttribute('content',
                    'width=1920, initial-scale=0.39, minimum-scale=0.1, maximum-scale=2.0, viewport-fit=cover');
            }
        })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Catan3.WebUI</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Catan3.WebUI.styles.css" rel="stylesheet" />

    <!-- Prefetch critical theme assets while WASM loads -->
    <link rel="prefetch" href="themes/base/tiles/brick.png" as="image" />
    <link rel="prefetch" href="themes/base/tiles/wheat.png" as="image" />
    <link rel="prefetch" href="themes/base/tiles/sheep.png" as="image" />
    <link rel="prefetch" href="themes/base/tiles/wood.png" as="image" />
    <link rel="prefetch" href="themes/base/tiles/ore.png" as="image" />
    <link rel="prefetch" href="themes/base/tiles/desert.png" as="image" />
</head>

<body>
    <div id="app">
        <div class="loading-screen">
            <div class="loading-logo">
                <svg viewBox="0 0 100 87" class="loading-hexagon">
                    <polygon points="50,0 100,25 100,75 50,100 0,75 0,25" fill="none" stroke="#d4a853" stroke-width="3"/>
                    <polygon points="50,10 90,30 90,70 50,90 10,70 10,30" fill="#2d5a27" stroke="#1a3d18" stroke-width="2"/>
                </svg>
            </div>
            <h1 class="loading-title">Catan</h1>
            <div class="loading-spinner-container">
                <svg class="loading-progress">
                    <circle r="40%" cx="50%" cy="50%" />
                    <circle r="40%" cx="50%" cy="50%" />
                </svg>
            </div>
            <div class="loading-progress-text"></div>
            <div class="loading-hint">Preparing your game...</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/svgRasterizer.js"></script>
    <script src="js/boardSizer.js"></script>
    <script src="js/viewportScaler.js"></script>

    <!-- Prefetch player images and warm up the API while WASM loads -->
    <script>
        (function() {
            // Get API URL from environment or default
            var apiUrl = 'https://catan-api.azurewebsites.net';

            // Update loading hint as we prefetch
            function setHint(text) {
                var hint = document.querySelector('.loading-hint');
                if (hint) hint.textContent = text;
            }

            // Prefetch an image by creating an Image object
            function prefetchImage(url) {
                var img = new Image();
                img.src = url;
            }

            // Fetch players and prefetch their images
            setHint('Warming up server...');
            fetch(apiUrl + '/api/players')
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    if (data.success && data.players) {
                        setHint('Loading player images...');
                        data.players.forEach(function(player) {
                            if (player.imageUri) {
                                prefetchImage(apiUrl + player.imageUri);
                            }
                        });
                        setHint('Almost ready...');
                    }
                })
                .catch(function() {
                    // Ignore errors - this is just prefetching
                    setHint('Preparing your game...');
                });
        })();
    </script>
</body>

</html>
