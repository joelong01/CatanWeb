name: Deploy React to Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  deploy-react:
    name: Deploy React UI (staging)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: react-ui/package-lock.json

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          # catan-azure.ps1 uses Az CLI, no extra modules needed
          az --version | head -1

      - name: Deploy React UI to staging slot
        shell: pwsh
        run: |
          ./.scripts/catan-azure.ps1 ui deploy-staging -Force -TraceLevel INFO

      - name: Verify React staging
        run: |
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 10 \
              https://catan-staging.azurewebsites.net 2>/dev/null || echo "000")
            echo "React staging ($((i*10))s): HTTP $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::React staging did not respond within 5 minutes"
          exit 1

      - name: Verify GameService staging (informational)
        continue-on-error: true
        run: |
          echo "=== GameService Staging Health ==="
          curl -sf https://catan-api-staging.azurewebsites.net/health | jq . || echo "GameService staging not responding (deploy separately if needed)"
          echo ""
          echo "=== Staging URLs ==="
          echo "React UI:    https://catan-staging.azurewebsites.net"
          echo "GameService: https://catan-api-staging.azurewebsites.net"
