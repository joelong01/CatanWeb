name: Deploy to Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  # Detect which components changed so we only deploy what's needed
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: filter
        run: |
          # Compare with parent commit to detect changed paths
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          echo "Changed files:"
          echo "$CHANGED"

          # Backend: GameService, Shared, or infrastructure script changes
          if echo "$CHANGED" | grep -qE '^(Catan3\.GameService|Catan3\.Shared|\.scripts|\.azure)/'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

          # Frontend: React UI changes
          if echo "$CHANGED" | grep -qE '^react-ui/'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

          # On workflow_dispatch, deploy everything
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          fi

  deploy-gameservice:
    name: Deploy GameService (staging)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Infrastructure first (firewall, RBAC, app settings), then deploy
      - name: Deploy GameService to staging
        shell: pwsh
        run: |
          pwsh .scripts/catan-cicd.ps1 gameservice -Slot staging -TraceLevel INFO

  deploy-react:
    name: Deploy React UI (staging)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: react-ui/package-lock.json

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy React UI to staging
        shell: pwsh
        run: |
          pwsh .scripts/catan-cicd.ps1 react -Slot staging -TraceLevel INFO

  verify:
    name: Verify staging
    needs: [changes, deploy-gameservice, deploy-react]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Staging summary
        run: |
          echo "=== Staging Deployment Summary ==="
          echo ""
          echo "Backend deployed: ${{ needs.changes.outputs.backend }}"
          echo "Frontend deployed: ${{ needs.changes.outputs.frontend }}"
          echo ""
          echo "=== Staging URLs ==="
          echo "React UI:    https://catan-staging.azurewebsites.net"
          echo "GameService: https://catan-api-staging.azurewebsites.net"
          echo ""
          echo "=== Health Check ==="
          curl -sf https://catan-api-staging.azurewebsites.net/health | jq . || echo "GameService not responding"
          echo ""
          curl -sf -o /dev/null -w "React UI: HTTP %{http_code}\n" https://catan-staging.azurewebsites.net || echo "React UI not responding"
