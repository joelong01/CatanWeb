name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Create MSIX signing certificate
        shell: pwsh
        run: |
          $pfxPath = "DesktopApp/Catan Desktop_TemporaryKey.pfx"
          if (-not (Test-Path $pfxPath)) {
            Write-Host "Creating self-signed certificate for MSIX signing..."
            $cert = New-SelfSignedCertificate `
              -Type Custom `
              -Subject "CN=CatanDesktopDev" `
              -KeyUsage DigitalSignature `
              -FriendlyName "Catan Desktop Dev Certificate" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}") `
              -NotAfter (Get-Date).AddYears(1)

            $pwd = ConvertTo-SecureString -String "CIBuildTemp123!" -Force -AsPlainText
            Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $pwd | Out-Null

            # Update csproj with new thumbprint
            $csproj = "DesktopApp/Catan Desktop.csproj"
            $content = Get-Content $csproj -Raw
            $content = $content -replace '<PackageCertificateThumbprint>[^<]+</PackageCertificateThumbprint>', "<PackageCertificateThumbprint>$($cert.Thumbprint)</PackageCertificateThumbprint>"
            Set-Content -Path $csproj -Value $content -NoNewline

            Write-Host "Certificate created: $($cert.Thumbprint)"
          }

      - name: Build full solution (including DesktopApp)
        run: dotnet build Catan.sln -c Release

      - name: Run tests
        shell: pwsh
        run: |
          dotnet test Tests/Shared -c Release --no-build
          # Skip tests that require the Cosmos emulator (or Azure) in CI:
          #   - CatanDb contract tests
          #   - ReplayEndpointTests (integration tests that hit /api/games + /api/game/new)
          # Run them locally with the emulator via: ./catan.ps1 test
          dotnet test Tests/GameService -c Release --no-build --filter "FullyQualifiedName!~CatanDb&FullyQualifiedName!~ReplayEndpointTests"
          # Note: Tests/Desktop requires a GUI and can only run locally
