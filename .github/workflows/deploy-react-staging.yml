name: Deploy React UI to Staging (manual)

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy React UI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: react-ui/package-lock.json

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy React UI to staging slot
        shell: pwsh
        run: |
          # Points at PRODUCTION GameService (tests React changes against prod backend)
          ./.scripts/catan-azure.ps1 ui deploy-staging -Force -TraceLevel INFO -GameServiceUrl https://catan-api.azurewebsites.net

      - name: Verify React staging
        run: |
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 10 \
              https://catan-staging.azurewebsites.net 2>/dev/null || echo "000")
            echo "React staging ($((i*10))s): HTTP $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::React staging did not respond within 5 minutes"
          exit 1
