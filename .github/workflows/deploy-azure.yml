name: Deploy to Production (Blue-Green)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Detect which components changed so we only deploy what's needed
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: filter
        run: |
          # Compare with parent commit to detect changed paths
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          echo "Changed files:"
          echo "$CHANGED"

          # Backend: GameService, Shared, or infrastructure script changes
          if echo "$CHANGED" | grep -qE '^(Catan3\.GameService|Catan3\.Shared|\.scripts|\.azure)/'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

          # Frontend: React UI changes
          if echo "$CHANGED" | grep -qE '^react-ui/'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

          # On workflow_dispatch, deploy everything
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          fi

  deploy-gameservice:
    name: Deploy GameService (production)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Infrastructure first (firewall, RBAC, app settings), then deploy
      - name: Deploy GameService to production
        shell: pwsh
        run: |
          pwsh .scripts/catan-cicd.ps1 gameservice -Slot production -TraceLevel INFO

  deploy-react:
    name: Deploy React + Swap
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: react-ui/package-lock.json

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Deploy React to the staging slot (inactive). The script derives the
      # GameService URL from .azure/catan-azure.json — no hardcoded hostnames
      # in this workflow (Finding I of the cicd-robustness review). Until the
      # GameService gets its own staging slot (Step 6), the script defaults
      # to the production GameService URL.
      - name: Deploy React to staging slot
        shell: pwsh
        run: ./.scripts/catan-azure.ps1 ui deploy-staging -Force -TraceLevel INFO

      # Verify the staging slot is healthy before swapping.
      # The script derives the URL from config.
      - name: Verify staging slot
        shell: pwsh
        run: ./.scripts/catan-azure.ps1 ui verify -Slot staging -TraceLevel INFO

      # Swap: staging becomes production, production becomes staging.
      # The script derives app/RG names from config; the workflow carries no
      # resource names (Finding I).
      - name: Swap slots
        shell: pwsh
        run: ./.scripts/catan-azure.ps1 ui swap -TraceLevel INFO

      # Verify production is serving the new version.
      - name: Verify production
        shell: pwsh
        run: ./.scripts/catan-azure.ps1 ui verify -Slot production -TraceLevel INFO

  verify:
    name: Verify production
    needs: [changes, deploy-gameservice, deploy-react]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Summary derives URLs from .azure/catan-azure.json — no hardcoded
      # resource names in this workflow (Finding I). Health gates are
      # performed in the deploy-react job via `ui verify`; this job is
      # informational. Versioned readiness and explicit rollback are
      # introduced by Steps 3, 4, and 7 of the cicd-robustness plan.
      - name: Production summary
        shell: pwsh
        run: |
          $cfg = Get-Content .azure/catan-azure.json | ConvertFrom-Json
          $base = $cfg.baseName
          $ui = "https://$base.azurewebsites.net"
          $api = "https://$base-api.azurewebsites.net"
          Write-Host "=== Production Deployment Summary ==="
          Write-Host "Backend deployed:  ${{ needs.changes.outputs.backend }}"
          Write-Host "Frontend deployed: ${{ needs.changes.outputs.frontend }}"
          Write-Host ""
          Write-Host "React UI:    $ui"
          Write-Host "GameService: $api"
          try {
            $r = Invoke-WebRequest -Uri "$api/health" -UseBasicParsing -TimeoutSec 10 -ErrorAction Stop
            Write-Host "GameService /health: HTTP $($r.StatusCode)"
          } catch {
            Write-Host "GameService /health: not responding"
          }
          try {
            $r = Invoke-WebRequest -Uri $ui -UseBasicParsing -TimeoutSec 10 -ErrorAction Stop
            Write-Host "React UI:            HTTP $($r.StatusCode)"
          } catch {
            Write-Host "React UI:            not responding"
          }
